spring.application.name=glg-corralon

spring.datasource.url=jdbc:h2:mem:starterdbtest;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.check-template-location=false

app.security.jwt.secret=testsecretkeytestsecretkeytestsecretkey123456
app.security.jwt.access-expiration=15m
app.security.jwt.refresh-expiration=3h
app.security.cookies.secure=false
app.security.mfa.hmac-secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

app.mail.host=localhost
app.mail.port=1025
app.mail.username=test
app.mail.password=test-password
app.mail.verification-base-url=http://localhost:8080
app.mail.frontend-base-url=http://localhost:5173

app.init.superadmin.enabled=false

logging.level.root=INFO
logging.level.org.springframework=WARN
