spring.application.name=glg-corralon

spring.datasource.url=${URL_DB}
spring.datasource.username=${USERNAME_DB}
spring.datasource.password=${PASSWORD_DB}
spring.datasource.driver-class-name=${DRIVER_DB:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

logging.level.root=INFO
logging.level.org.springframework=WARN

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:15m}
app.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:3h}
app.security.cookies.secure=${COOKIE_SECURE:true}
app.security.password-reset.token-ttl=${PASSWORD_RESET_TOKEN_TTL:30m}
app.security.mfa.hmac-secret=${MFA_HMAC_SECRET}
app.security.mfa.challenge-ttl=${MFA_CHALLENGE_TTL:5m}
app.security.mfa.max-failed-attempts=${MFA_MAX_FAILED_ATTEMPTS:5}
app.security.mfa.resend-cooldown=${MFA_RESEND_COOLDOWN:60s}
app.security.mfa.max-resends=${MFA_MAX_RESENDS:3}
app.security.mfa.aggregate-window=${MFA_AGGREGATE_WINDOW:15m}
app.security.mfa.max-code-issues-per-window=${MFA_MAX_CODE_ISSUES_PER_WINDOW:5}
app.security.mfa.max-code-failures-per-window=${MFA_MAX_CODE_FAILURES_PER_WINDOW:10}
app.security.mfa.login-window=${MFA_LOGIN_WINDOW:15m}
app.security.mfa.max-login-attempts-per-account=${MFA_MAX_LOGIN_ATTEMPTS_PER_ACCOUNT:10}
app.security.mfa.max-login-attempts-per-ip=${MFA_MAX_LOGIN_ATTEMPTS_PER_IP:30}
app.security.mfa.trusted-proxy-addresses=${MFA_TRUSTED_PROXY_ADDRESSES:}

app.mail.host=${EMAIL_HOST}
app.mail.port=${EMAIL_PORT:587}
app.mail.username=${EMAIL_USERNAME}
app.mail.password=${EMAIL_PASSWORD}
app.mail.verification-base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:8080}
app.mail.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}

app.init.superadmin.enabled=${INIT_SUPERADMIN_ENABLED:false}
app.init.superadmin.email=${INIT_SUPERADMIN_EMAIL:}
app.init.superadmin.password=${INIT_SUPERADMIN_PASSWORD:}
